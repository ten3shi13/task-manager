services:
  taskmanager-api:
    image: taskmanager-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
        - 8080:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SecretKey: ${JWT_SECRET}
      ConnectionStrings__TaskManagerMediatRDbContext : "Host=taskmanager-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "taskmanager-cache:6379,password=${CACHE_PASSWORD}"
    depends_on:
      taskmanager-db:
        condition: service_healthy
      taskmanager-cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - taskmanager-network
  taskmanager-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - dbdata:/var/lib/postgresql/data
    #ports:
    #  - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskmanager-network
  taskmanager-cache:
    image: redis:8-alpine
    environment:
      - CACHE_PASSWORD=${CACHE_PASSWORD}
    command: redis-server --requirepass ${CACHE_PASSWORD}
    #ports:
    #  - 6379:6379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${CACHE_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - taskmanager-network

volumes:
  dbdata:

networks:
  taskmanager-network:
    driver: bridge